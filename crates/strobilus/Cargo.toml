[package]
name = "strobilus"
version = "0.1.0"
edition = "2024"

[dependencies]
cedar-policy-core = { workspace = true }
strobilus-core = { path = "../strobilus-core"}
ref-cast = "1.0"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
lalrpop-util = { version = "0.22.2", features = ["lexer"] }
itertools = "0.14"
miette = "7.6.0"
thiserror = "2.0"
smol_str = { version = "0.3", features = ["serde"] }
dhat = { version = "0.3.2", optional = true }
serde_with = "3.13.0"
nonempty = "0.10"
prost = { version = "0.13", optional = true }
rand = "0.8"

# wasm dependencies
serde-wasm-bindgen = { version = "0.6", optional = true }
tsify = { version = "0.4.5", optional = true }
wasm-bindgen = { version = "0.2.97", optional = true }
semver = "1.0.26"
lazy_static = "1.5.0"
parking_lot = "0.12.5"

[features]
symbolic = []
